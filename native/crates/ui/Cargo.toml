[package]
name = "lizmeter-ui"
version.workspace = true
edition.workspace = true

[dependencies]
gpui.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
unicode-segmentation = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
