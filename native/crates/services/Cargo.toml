[package]
name = "lizmeter-services"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
lizmeter-core = { version = "0.0.1", path = "../core" }
lizmeter-db = { version = "0.0.1", path = "../db" }
lizmeter-sync = { version = "0.0.1", path = "../sync" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
thiserror = "2.0.21"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_Media_Audio",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Data_Xml_Dom",
  "UI_Notifications",
  "Foundation",
]

[dev-dependencies]
tempfile = "3.27.0"
