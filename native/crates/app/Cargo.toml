[package]
name = "lizmeter-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lizmeter"
path = "src/main.rs"

[dependencies]
lizmeter-ui = { path = "../ui" }
lizmeter-core = { path = "../core" }
lizmeter-db = { path = "../db" }
lizmeter-services = { path = "../services" }
lizmeter-music = { path = "../music" }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
gpui.workspace = true
png.workspace = true
image = { workspace = true, features = ["png", "gif", "webp"] }
raw-window-handle.workspace = true
windows = { workspace = true, features = ["Win32_Globalization", "Win32_System_Console", "Win32_UI_Controls"] }

[dev-dependencies]
tempfile = "3.27.0"
